name: Android

# Public repository: GitHub-hosted runners are free and unmetered.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Tests, lint and debug build
        run: ./gradlew test lint assembleDebug

      # With the four secrets set, the APK is signed with the personal release key, so each
      # new version installs over the previous one. Without them, each run signs with a new
      # throwaway debug key and the app has to be uninstalled before updating.
      - name: Release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SCAMSTOP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SCAMSTOP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCAMSTOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCAMSTOP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets: publishing a debug APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Signed release build
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/ScamStop.$version.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/ScamStop.$version-debug.apk"
          fi
          rm -f keystore.properties
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ScamStop-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  # Pushing a tag such as v2.0.0 publishes the APK as a GitHub release, downloadable from a phone.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScamStop-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --title "Scam Stop $GITHUB_REF_NAME" --generate-notes
